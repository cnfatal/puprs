[package]
name = "puprs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Puppeteer-inspired high-level browser automation SDK for Rust"

[dependencies]
chromiumoxide = { git = "https://github.com/cnfatal/chromiumoxide.git", branch = "main", features = [
    "bytes",
] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
