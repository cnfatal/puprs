[package]
name = "puprs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Puppeteer-inspired high-level browser automation SDK for Rust"
repository = "https://github.com/cnfatal/puprs"
homepage = "https://github.com/cnfatal/puprs"
keywords = ["browser", "automation", "puppeteer", "chrome", "cdp"]
categories = ["web-programming"]

[dependencies]
chromiumoxide_cdp = "0.9"
chromiumoxide_types = "0.9"
async-tungstenite = { version = "0.32", features = ["tokio-runtime"] }
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
    "process",
    "fs",
    "sync",
    "io-util",
] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
fnv = "1"
which = "8"
tracing = "0.1"
dunce = "1"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rand = "0.9"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
image = "0.25"
